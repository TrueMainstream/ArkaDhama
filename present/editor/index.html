<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arka Dhama — river editor</title>
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<header class="bar">
  <span class="mark">Arka Dhama</span>
  <nav class="rivers" id="rivers" aria-label="Choose a river"></nav>
  <div class="doc-area">
    <p class="doc-actions">
      <button type="button" id="save">Save</button>
      <button type="button" id="publish">Publish</button>
      <button type="button" id="revert">Revert</button>
      <button type="button" id="history">History</button>
      <span id="status" aria-live="polite"></span>
    </p>
    <div id="history-list" hidden></div>
  </div>
</header>

<main class="work">
  <section class="lane" aria-label="The selected river">
    <div class="pane-wrap" id="wrap-canvas">
      <h2 class="pane-label" id="pane-label">Top layer</h2>
      <div class="pane" id="pane"></div>
    </div>
  </section>

  <aside class="panel" aria-label="River and block controls">
    <section class="group">
      <h3>Blocks</h3>
      <p class="hint">The tabs at the foot of the page switch which layer of this same page you are editing. A new block lands on the layer that is showing.</p>
      <div class="row">
        <button type="button" id="add-text">Add text</button>
        <button type="button" id="add-image">Add image</button>
        <button type="button" id="add-mask">Add mask</button>
        <button type="button" id="add-event">Add event</button>
      </div>
    </section>

    <section class="group">
      <h3>Selected block</h3>
      <div id="block-fields"></div>
      <button type="button" id="delete-selected">Delete selected</button>
    </section>

    <section class="group">
      <h3>River colour</h3>
      <div class="row" id="river-colour">
        <button type="button" data-color="#002040"><span class="chip" style="background:#002040"></span>Navy</button>
        <button type="button" data-color="#6a4e12"><span class="chip" style="background:#6a4e12"></span>Gold</button>
      </div>
    </section>
  </aside>
</main>

<footer class="tabs" aria-label="Choose the layer a new block lands on">
  <button type="button" class="tab" data-layer="top">Top layer</button>
  <button type="button" class="tab" data-layer="bottom">Still layer</button>
</footer>

<!-- Both scripts are modules so they run in this order after the page is
     parsed. editor.js first asks the worker for the live document; doc.js
     is the seed it copies when nothing has been saved. If neither arrives,
     editor.js stops the page on the words "Document unavailable." -->
<script type="module" src="/present/doc.js"></script>
<script type="module" src="/editor/editor.js"></script>
</body>
</html>
