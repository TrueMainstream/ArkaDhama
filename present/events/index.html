<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arka Dhama — Events</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #002040;
    color: #f4efe6;
    font: 16px/1.6 Georgia, 'Times New Roman', serif;
  }
  main { max-width: 780px; margin: 0 auto; padding: 56px 32px 96px; }
  h1, h2 { font-weight: normal; letter-spacing: 0.08em; }
  h1 { font-size: 30px; margin: 0 0 8px; }
  .lede { margin: 0 0 40px; color: #cfc6b6; }
  h2 { font-size: 19px; margin: 56px 0 18px; }

  .panel { background: #01305c; border: 1px solid #23558a; }
  form { padding: 28px; display: grid; gap: 18px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
  .field.wide { grid-column: 1 / -1; }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #cfc6b6;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    background: #002040;
    color: #f4efe6;
    border: 1px solid #23558a;
    font: inherit;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid #f4efe6; outline-offset: -1px; }
  .form-actions { display: flex; justify-content: flex-end; }

  button {
    padding: 10px 26px;
    background: transparent;
    color: #f4efe6;
    border: 1px solid #6a4e12;
    font: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  button:hover { background: rgba(244, 239, 230, 0.14); }

  ul#event-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .post {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    padding: 18px 22px;
    background: #01305c;
    border: 1px solid #23558a;
  }
  .post-when { font-size: 14px; letter-spacing: 0.08em; color: #cfc6b6; }
  .post-title { font-size: 18px; margin-top: 2px; }
  .post-summary { margin: 8px 0 0; color: #ded6c8; }
  .post .remove { padding: 8px 18px; flex: none; }

  .note { margin: 18px 0 0; font-style: italic; color: #cfc6b6; }
</style>
</head>
<body>
<main>
  <h1>Events</h1>
  <p class="lede">The staff posts for the Events section. Added here, stored in one place, removed here.</p>

  <form id="event-form" class="panel">
    <div class="fields">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>
      <div class="field wide">
        <label for="place">Place</label>
        <input type="text" id="place" name="place">
      </div>
      <div class="field wide">
        <label for="summary">Summary</label>
        <textarea id="summary" name="summary"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit">Add event</button>
    </div>
  </form>

  <h2>Stored events</h2>
  <ul id="event-list"></ul>
  <p id="empty-note" class="note" hidden>No events stored yet.</p>
  <p id="error-note" class="note" hidden></p>
</main>
<script src="/events.js"></script>
</body>
</html>
